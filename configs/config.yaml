# PigeonBox 飞牛适配层默认配置——fpk 内嵌只读副本的单源
# (scripts/build-native.sh 同步进 fnos/app/configs/)。
# fnOS 安装向导/配置面板经 PB_* env 覆盖同名项；
# core 对 open_upload/datapath/storage_path 无零值可用默认(缺失时上传被拒、
# 存储路径为空)，故必须随包携带默认值。
server:
  host: "0.0.0.0"
  port: 12345
  mode: "release"
  # base_url 留空=分享链接用请求头推断;反代/穿透场景建议显式配置
  base_url: ""
# /app/data 系占位默认:fpk 运行时恒被 PB_* env 覆盖为 ${TRIM_PKGVAR}/data,
# 仅裸进程开发调试直接使用。
database:
  driver: "sqlite"
  db_name: "/app/data/fileCodeBox.db"
app:
  name: "PigeonBox"
  datapath: "/app/data"
upload:
  # 匿名口令分享是产品核心能力,开箱即用(管理后台可关)
  open_upload: true
  upload_size: 10485760      # 10MB 单请求体上限
  enable_chunk: true
  chunk_size: 2097152        # 2MB
storage:
  type: "local"
  storage_path: "/app/data/uploads"
log:
  level: "info"
user:
  allow_user_registration: false  # NAS 场景默认关闭开放注册（管理员建号）；如需开放改 true
observability:
  metrics:
    enabled: false
