name: Version Tagger
# 合并列车 bump PR(VERSION 变更)后自动打 tag → 既有 Release 流水线接管。
# 门禁: 仅 commit message 以 "train:" 开头的 VERSION 变更才打 tag(防无关改动误发版)。
# 双写一致性: VERSION 必须与 fnos/manifest 的 version 同步(bump 脚本同写,此处断言)。
on:
  push:
    branches: [master] # 本仓主分支为 master(其余终端仓为 main)
    paths: ["VERSION"]
permissions:
  contents: write
  actions: write
concurrency: version-tagger
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: 校验并打 tag
        env:
          GH_TOKEN: ${{ secrets.FNOS_PAT }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::缺 secret FNOS_PAT——GITHUB_TOKEN 推 tag 不触发 Release 工作流(防递归限制)"; exit 1; }
          MSG=$(git log -1 --format=%s)
          case "$MSG" in train:*) ;; *) echo "跳过:commit '${MSG}' 非列车 bump(仅 train: 前缀触发)"; exit 0;; esac
          VER=$(cat VERSION); TAG="v${VER}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then echo "tag ${TAG} 已存在,跳过"; exit 0; fi
          MV=$(awk -F= '$1=="version"{print $2}' fnos/manifest)
          [ "$MV" = "$VER" ] || { echo "::error::fnos/manifest version=$MV ≠ VERSION=$VER——发版走 hub 列车 bump,勿单手改一处"; exit 1; }
          git config user.name "$GITHUB_ACTOR"; git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag "$TAG"; git push origin "refs/tags/${TAG}"
          # 1.15.0 列车实测:token 推 tag 不产生 push 事件,Release 静默不触发→显式 dispatch 兜底(与 push 触发幂等共存)
          gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f version="$TAG" \
            || { echo "::error::Release dispatch 失败——断链不吞错,立即人工补救"; exit 1; }
          echo "✓ 已打 tag ${TAG} 并 dispatch Release"
