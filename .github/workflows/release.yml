name: Release
# 打 v* tag → 三路发布:
#   1. release: 多架构镜像推 ghcr.io/filescodebox/fnos
#   2. fpk + attach-fpk: fnpack 打应用包,挂本仓 Release(GITHUB_TOKEN 同仓写即可)
#   3. attach-to-hub: 回挂 fpk 到生态主仓 filescodebox/filescodebox 的 Release(tag fnos-v*,
#      与 desktop 回挂 desktop-v* 同模式——所有二进制产物统一在主仓 Releases 可下载;
#      跨仓写用 FNOS_PAT,secret 未配置时本 job 失败放行(continue-on-error),本地 gh release upload 兜底)
# workflow_dispatch: 传 version(现有 tag 名,如 v0.3.0)对该版本手动重跑 fpk 打包+双挂(不发镜像),用于验证/补救
# (2026-10-04 随仓改名 filescodebox-fnos → fnos 对齐;旧镜像 filescodebox-fnos 冻结在 v0.2.6,更早 filecodebox-fnos 冻结在 v0.2.1)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v0.3.0)。仅重跑 fpk 打包+双挂,不发镜像'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/filescodebox/fnos

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx 默认附带的 provenance 认证清单会使 GitHub Packages 页面渲染
          # 500(注册表拉取不受影响,仅 Web UI 坏)。关掉以保证包页可开、可见性可改。
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct

  fpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动 dispatch 时按输入版本检出对应 tag,fpk 与 tag 构建严格一致
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 原生产物构建(双架构二进制+前端,版本注入与镜像同源)
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/build-native.sh
      - name: 下载 fnpack(官方 CLI,与 ci.yml package job 同源)
        run: |
          curl -fsSL --retry 3 -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack
      - name: fnpack build
        run: cd fnos && ../fnpack build
      - uses: actions/upload-artifact@v4
        with:
          name: filescodebox-fpk
          path: fnos/filescodebox.fpk
          retention-days: 14
          if-no-files-found: error

  attach-fpk:
    needs: fpk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filescodebox-fpk
          path: fpk
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "FilesCodeBox fnOS ${VER}" \
              --notes "飞牛 fnOS 原生应用包(见 Assets filescodebox.fpk,内含双架构二进制+前端,安装/运行免 Docker 免镜像拉取)。Docker 部署走 ghcr.io/filescodebox/fnos(tag 跟随本 Release)。"
          gh release upload "${VER}" fpk/filescodebox.fpk --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    needs: fpk
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filescodebox-fpk
          path: fpk
      - name: 回挂 fpk 到生态主仓
        env:
          GH_TOKEN: ${{ secrets.FNOS_PAT }}
          TAG: fnos-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [filescodebox/fnos](https://github.com/filescodebox/fnos) · **完整变更日志**: [%s](https://github.com/filescodebox/fnos/releases/tag/%s)\n🌐 **生态总览 / Latest**: [filescodebox/filescodebox](https://github.com/filescodebox/filescodebox/releases/latest)\n' \
            "飞牛 fnOS 原生应用包(见 Assets,免 Docker 免镜像拉取)。Docker 部署: ghcr.io/filescodebox/fnos。" "${VER}" "${VER}")
          gh release view "${TAG}" --repo filescodebox/filescodebox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo filescodebox/filescodebox \
              --title "FilesCodeBox fnOS ${VER}" \
              --latest=false \
              --notes "${NOTES}"
          gh release upload "${TAG}" fpk/filescodebox.fpk --repo filescodebox/filescodebox --clobber
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "${TAG}" --repo filescodebox/filescodebox --latest=false || true
          echo "已回挂到 filescodebox/filescodebox Releases"
