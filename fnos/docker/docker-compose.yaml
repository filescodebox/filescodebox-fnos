# FileCodeBox 飞牛(fnOS)容器编排
#
# 飞牛变量占位(由飞牛应用框架在安装时注入):
#   ${DOCKER_MIRROR}  Docker 镜像加速前缀(可空)
#   ${VERSION}        应用版本(取自 manifest.version)
#   ${TRIM_SERVICE_PORT}  对外端口(用户在安装向导配置,映射到容器 12345)
#   ${TRIM_PKGVAR}    飞牛包变量目录(用户可见的 NAS 共享路径),映射到容器 /app/data
#   ${FNOS_APPID} / ${FNOS_APPSECRET}  飞牛 Open API 凭证(向导可选配置,缺省=降级模式)
#
# 设计:
#   - 数据(上传文件 + SQLite 库)全部落在 ${TRIM_PKGVAR}/data,即用户可见的 NAS 共享文件夹,
#     可在飞牛文件管理中直接查看、备份、迁移。
#   - service_port=12345 与 FileCodeBox 默认端口一致。
services:
  filecodebox:
    image: ${DOCKER_MIRROR}docker.io/zy84338719/filecodebox-fnos:${VERSION}
    container_name: filecodebox
    ports:
      - "${TRIM_SERVICE_PORT}:12345"
    volumes:
      - ${TRIM_PKGVAR:?}/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - FCB_SERVER_HOST=0.0.0.0
      - FCB_SERVER_PORT=12345
      - FCB_SERVER_MODE=release
      - FCB_PRODUCTION=1
      - FCB_DATA_PATH=/app/data
      - FCB_DATABASE_DRIVER=sqlite
      - FCB_DATABASE_DB_NAME=/app/data/fileCodeBox.db
      - FCB_OPEN_UPLOAD=true
      # 飞牛 Open API 凭证(缺省时应用以降级模式运行,飞牛能力关闭,业务正常)
      - FNOS_ENABLED=${FNOS_ENABLED:-false}
      - FNOS_APPID=${FNOS_APPID:-}
      - FNOS_APPSECRET=${FNOS_APPSECRET:-}
    restart: unless-stopped
